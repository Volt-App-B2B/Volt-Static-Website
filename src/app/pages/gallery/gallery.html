<app-page-hero eyebrow="Gallery">
  <h1 class="disp">Inside <span class="lime">Volt</span>.</h1>
  <p class="sub">
    Take a look around our main location: the courts, the training halls, the recovery rooms and the people who fill
    them.
  </p>
</app-page-hero>

<section class="pad body">
  <div class="wrap">
    <div class="gal">
      @for (g of items; track g.photo; let i = $index) {
        <button
          type="button"
          class="g-item"
          [style.--d]="i * 0.05 + 's'"
          [attr.aria-label]="'Open photo: ' + g.title"
          (click)="lightboxIndex.set(i)"
        >
          <app-gallery-media [item]="g" />
          <span class="g-zoom"><app-icon [markup]="icons.zoom" [stroke]="2.2" /></span>
          <span class="g-cap"
            ><b>{{ g.title }}</b
            ><i>{{ g.subtitle }}</i></span
          >
        </button>
      }
    </div>
  </div>
</section>

@let open = lightboxIndex();
@if (open !== null) {
  <app-lightbox [items]="items" [index]="open" (indexChange)="lightboxIndex.set($event)" (closed)="lightboxIndex.set(null)" />
}
